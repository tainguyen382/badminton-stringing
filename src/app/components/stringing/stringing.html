<main class="workflow-page pb-8">
    <header class="workflow-page-heading">
        <p class="workflow-kicker">Stringing entry</p>
        <h1>{{ isEditing ? 'Update stringing job' : 'New stringing job' }}</h1>
        <p>{{ isEditing ? 'Review the details and save your changes.' : 'Enter the customer and racket details for this service.' }}</p>
    </header>

    <section class="workflow-panel">
        <section class="workflow-section">
            <div class="workflow-section-heading">
                <span>01</span>
                <h2>Customer and racket</h2>
            </div>
            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                <label class="workflow-field" for="customer-name">
                    Customer name
                    <input id="customer-name" type="text" [(ngModel)]="form.name" name="customerName"
                        class="workflow-control" placeholder="Customer name">
                </label>
                <label class="workflow-field" for="job-date">
                    Service date
                    <input id="job-date" type="date" [(ngModel)]="form.date" name="serviceDate" class="workflow-control">
                </label>
                <label class="workflow-field sm:col-span-2" for="racket-model">
                    Racket model
                    <input id="racket-model" type="text" [(ngModel)]="form.racketModel" name="racketModel"
                        class="workflow-control" placeholder="e.g. Yonex Nanoflare 1000Z">
                </label>
            </div>
        </section>

        <section class="workflow-section">
            <div class="workflow-section-heading">
                <span>02</span>
                <h2>String setup</h2>
            </div>
            <div class="grid grid-cols-2 gap-3 sm:gap-4">
                <label class="workflow-field" for="string-type">
                    String type
                    <select id="string-type" [(ngModel)]="form.stringType" name="stringType" class="workflow-control">
                        <option value="" disabled>Select string</option>
                        <option *ngFor="let string of (stringList$ | async)" [value]="string">{{ string }}</option>
                    </select>
                </label>
                <label class="workflow-field" for="tension">
                    Tension
                    <input id="tension" type="text" [(ngModel)]="form.tension" name="tension"
                        (blur)="normalizeTension()" class="workflow-control" placeholder="e.g. 26x28">
                </label>
            </div>
        </section>

        <section class="workflow-section">
            <div class="workflow-section-heading">
                <span>03</span>
                <h2>Pricing and payment</h2>
            </div>
            <div class="pricing-grid grid grid-cols-3 gap-2 sm:gap-4">
                <label class="workflow-field" for="service-price">
                    <span class="workflow-field-label">Service price</span>
                    <span class="workflow-input-prefix">
                        <span aria-hidden="true">$</span>
                        <input id="service-price" type="number" [(ngModel)]="form.servicePrice" name="servicePrice"
                            class="workflow-control" placeholder="25">
                    </span>
                </label>
                <label class="workflow-field" for="discount">
                    <span class="workflow-field-label">Discount</span>
                    <span class="workflow-input-prefix">
                        <span aria-hidden="true">$</span>
                        <input id="discount" type="number" [(ngModel)]="form.discount" name="discount"
                            class="workflow-control" placeholder="0">
                    </span>
                </label>
                <label class="workflow-field" for="payment-method">
                    <span class="workflow-field-label">Payment</span>
                    <select id="payment-method" [(ngModel)]="form.paymentMethod" name="paymentMethod" class="workflow-control">
                        <option value="" disabled>Select</option>
                        <option *ngFor="let paymentType of (paymentTypes$ | async)" [value]="paymentType">{{ paymentType }}</option>
                    </select>
                </label>
            </div>
        </section>

        <div class="workflow-actions">
            <button type="button" (click)="saveJob()" [disabled]="saving"
                class="workflow-primary-action inline-flex items-center justify-center gap-2 disabled:cursor-not-allowed disabled:opacity-60">
                <span *ngIf="saving" class="h-4 w-4 rounded-full border-2 border-white border-t-transparent animate-spin"></span>
                <span>{{ saving ? (isEditing ? 'Updating...' : 'Saving...') : (isEditing ? 'Save changes' : 'Save job') }}</span>
            </button>
            <button type="button" (click)="resetForm()" [disabled]="saving" class="workflow-secondary-action">
                Clear form
            </button>
        </div>
    </section>
</main>
